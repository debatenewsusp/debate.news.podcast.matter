name: Daily episode

on:
  schedule:
    - cron: "41 8 * * *"   # 08:41 UTC = 05:41 in Sao Paulo
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install edge-tts mutagen

      - name: Get current site (gh-pages)
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site || mkdir -p site
          rm -rf site/.git
          cp cover.png site/cover.png
          touch site/.nojekyll

      - name: Generate next episode
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          KEEP_EPISODES: "7"
        run: python scripts/publish.py

      - name: Publish site (single commit, no history growth)
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Episode update $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
